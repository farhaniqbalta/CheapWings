# CheapWings iPad app (P5.2). Generate with `xcodegen generate`; signing team is passed at build
# time (DEVELOPMENT_TEAM=...) so no personal data lives in the repo. Run core/build-ios.sh first.
name: CheapWings
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  CheapWingsKit:
    path: ../CheapWingsKit
  CheapWingsCore:
    path: ../CheapWingsCore
targets:
  CheapWings:
    type: application
    platform: iOS
    sources:
      - Sources
      # App icon (light / dark / tinted); SVG sources in docs/design/app-icon.
      - Resources/Assets.xcassets
      # Same location catalog as the backend and web app (one file, no copy to drift).
      - path: ../../../backend/src/cheapwings/locations/catalog.json
        buildPhase: resources
      # Airline code → name (generated from the fli table the web uses).
      - path: ../../../contracts/airlines.json
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        # iOS 26+ continued processing for user-started searches (P5.3).
        BGTaskSchedulerPermittedIdentifiers: [dev.cheapwings.app.search.*]
    dependencies:
      - package: CheapWingsKit
      - package: CheapWingsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cheapwings.app
        PRODUCT_NAME: CheapWings
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CheapWings
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
