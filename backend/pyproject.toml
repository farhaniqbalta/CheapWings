[project]
name = "cheapwings"
version = "0.1.0"
description = "CheapWings: low-cost, flexible-date, one-way flight price comparison backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
live = ["mcp==2.3.0", "swoop-flights==0.7.0", "airportsdata==20261103"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
