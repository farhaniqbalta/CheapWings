[package]
name = "cheapwings-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "CheapWings shared engine core: money, identity, ranking, Fli decoding. No I/O."

[dependencies]
base64 = "0.22"
regex = "1"
rust_decimal = "=1.43.0"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps each JSON number's original text (exact price lexemes).
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
unicode-normalization = "0.1"
