[package]
name = "core-s5"
version = "0.1.0"
edition = "2021"
publish = false

# P5.06 spike S5 (B): money + fingerprint + ranking core in Rust, called from Swift via UniFFI.
[lib]
name = "core_s5"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
rust_decimal = "=1.43.0"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
